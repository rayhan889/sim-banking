services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: simbank_db
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=simbank'
      - 'POSTGRES_USER=simbank'
      - 'POSTGRES_PASSWORD=simbank'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
